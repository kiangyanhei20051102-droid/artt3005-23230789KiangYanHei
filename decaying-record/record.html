<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pale: '#f4f5f8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pale min-h-screen w-full flex items-center justify-center p-4 font-sans text-gray-800 antialiased">

    <!-- Centered Card (approx 460px x 520px) -->
    <div class="w-full max-w-[460px] h-[520px] bg-white rounded-2xl shadow-xl hover:shadow-2xl transition-shadow duration-300 p-6 flex flex-col justify-between border border-gray-100/80">
        
        <!-- Top Section: Image + Text Header -->
        <div class="flex flex-col flex-1">
            
            <!-- Large Image Placeholder -->
            <div class="w-full h-64 bg-slate-100 rounded-xl flex flex-col items-center justify-center overflow-hidden border border-slate-200/60 group relative">
                <!-- SVG Placeholder Icon -->
                <svg class="w-16 h-16 text-slate-300 group-hover:scale-105 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-xs font-medium text-slate-400 mt-2 uppercase tracking-wider">Image Placeholder</span>
            </div>

            <!-- Content Area -->
            <div class="mt-5 flex flex-col">
                <!-- Title -->
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight leading-snug hover:text-indigo-600 transition-colors">
                    Document Title & Record #802
                </h2>
                
                <!-- Line of smaller grey text -->
                <p class="text-sm text-gray-500 mt-1.5 font-normal tracking-normal flex items-center gap-2">
                    <span>Created on Oct 24, 2026</span>
                    <span>•</span>
                    <span>14.2 MB</span>
                    <span>•</span>
                    <span class="text-emerald-600 font-medium">Active</span>
                </p>
            </div>
        </div>

        <!-- Action Button at the Bottom -->
        <div class="pt-4 border-t border-gray-100 mt-auto">
            <button 
                id="archiveBtn"
                onclick="handleArchive()"
                class="w-full bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-medium py-3 px-4 rounded-xl shadow-sm hover:shadow transition-all duration-200 flex items-center justify-center gap-2 group">
                <svg class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                </svg>
                <span>Archive this</span>
            </button>
        </div>

    </div>

    <!-- Feedback Message Box (Replaces native alert) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 z-50">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="toastMessage">Record has been successfully archived.</span>
    </div>

    <script>
        function handleArchive() {
            const btn = document.getElementById('archiveBtn');
            const toast = document.getElementById('toast');
            
            // Visual state change
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Archiving...
            `;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // Simulate operation
            setTimeout(() => {
                btn.innerHTML = `
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>Archived</span>
                `;
                btn.classList.remove('bg-slate-900', 'hover:bg-slate-800', 'opacity-75', 'cursor-not-allowed');
                btn.classList.add('bg-slate-700');

                // Show toast notification
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');

                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            }, 800);
        }
    </script>
</body>
</html>
